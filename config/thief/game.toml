# Private per-peer configuration for the THIEF agent.
#
# This file is ours alone: it never crosses the network and is never signed.
# Anything the opponent must agree to lives in the shared, SHA-256-locked
# config/game.json, which OVERLAYS this file (book PAGE 127) — a private
# setting can never weaken an agreed term.
#
# Secrets belong in .env, never here.

version = "1.00"

[game]
group_name = "NajAmjad"
group_id = "najamjad"
members = ["Naji Kayal", "Amjad Abed"]

# The public endpoints we publish. Sent in the handshake and copied into the
# opponent's declaration, so they must be the URLs an opponent can actually
# reach — not the local ports.
[game.mcp_servers]
cop = "https://cop.4laboratory.com/mcp"
thief = "https://thief.4laboratory.com/mcp"

[game.repos]
cop = "https://github.com/najikay/najamjad-cop"
thief = "https://github.com/najikay/najamjad-thief"

[network]
# Our own MCP server port. The thief agent uses 8801 so both can run locally.
my_port = 8801
# Set per match from the opponent's public URL, exchanged during negotiation.
opponent_url = "https://mask-matching-stevens-omissions.trycloudflare.com/mcp"
# Their group id, set per match once negotiation reveals it. Until then the
# tracker scores against this placeholder and the filer relabels the result.
opponent_group_id = "them"
# How long to wait for their signed terms before giving up on the handshake.
handshake_timeout_seconds = 60
# Appendix F Table 19: response timeout 30 s, watchdog 60 s (both negotiable).
response_timeout_seconds = 30
# Cap on ONE outbound MCP call, and it must stay strictly under the signed
# response timeout above — `build_transport` refuses to start otherwise. The
# MCP SDK's own default is 30 s, so a push that is delivered but never answered
# plus one retry breaches a 30 s deadline we signed, with no single call in the
# log looking slow.
call_timeout_seconds = 10
watchdog_threshold_seconds = 60
max_retries = 3
# T-2447: a failed agreement exchange retries the SAME sub-game this many
# times before resolving it as a technical outcome. Advancing on failure is
# what desynchronised our numbering from the opponent's (rules 33-35).
handshake_retries = 2
# How long to wait for the opponent to come up before giving up. Two teams
# agreeing "20:00" do not both start within two minutes — the old default —
# and a wait that expires now stops the match with a message rather than
# walking into a 502 at the handshake. Set 0 to skip waiting entirely.
opponent_wait_seconds = 900

[tunnel]
# A PERMANENT hostname — this is the whole point. Cloudflare named tunnels do
# not mint a new URL on restart, so an opponent's saved address keeps working
# (ADR-004; the defect that cost Assignment 6 the most time).
provider = "cloudflare"
hostname = "thief.4laboratory.com"
name = "najamjad-thief"

[llm]
# Provider chain: deepseek -> anthropic -> template (ADR-003). The active
# provider is always visible in the logs and the dashboard badge.
#
# A vendor whose API key is absent is skipped entirely rather than tried and
# failed: retrying a missing key cost 20 s on the first hint, against a 30 s
# turn deadline (docs/CONFIG.md §4).
primary = "deepseek"
fallback = "anthropic"
# The primary's model, and the one declared to the opponent — those must be the
# same string or the declaration names a model we never call.
#
# `deepseek-chat` was retired; the current line is `deepseek-v4-flash` and
# `deepseek-v4-pro`. Flash writes a 15-word hint just as well for a third of
# the price, so pro is a deliberate upgrade rather than the default.
model = "deepseek-v4-flash"
fallback_model = "claude-haiku-4-5-20251001"
negotiation_model = "claude-sonnet-5"
step_deadline_seconds = 30
# Hint cadence. This is a QUALITY dial, not a savings dial — the budget has
# room (see docs/TOKEN_BUDGET.md).
every_n_steps = 2
# Seconds one hint call may take. The turn deadline is 30 s and a COLD vendor
# call was measured at 27-61 s, so an unbounded call can spend the whole turn.
# There was no timeout at all before this: a hanging vendor blocked on the SDK
# default (~600 s). A hint is optional and has a free template floor; the
# deadline is not. Erring short costs hint quality, never the turn.
hint_timeout_seconds = 8
series_token_budget = 200000
project_token_budget = 5000000

[email]
# Book Appendix F Table 20: the ONLY permitted destination for agent reports.
recipient = "rmisegal+uoh26finalgame@gmail.com"
# "draft" while developing; the league requires "send".
mode = "draft"

[strategy]
# Scalars first: a bare key belongs to the most recent table header, so putting
# these after the sub-tables below silently made them members of [strategy.thief]
# and the thief was handed `cop_class` as a tunable.
#
# Empty means the shipped brains; a "module:Attribute" path loads a plugin
# (docs/EXTENDING.md §1).
cop_class = ""
thief_class = ""

# The dials the sweep varies and the notebook measures. Shipped values are the
# measured optimum — see notebooks/analysis.ipynb §2.
#
# barrier_threshold is the one that decides matches: 0.05 captured 4% of games,
# 0.40 captured 100%. A barrier is impassable for BOTH sides, so walling on weak
# evidence fences us away from the thief we are chasing.
[strategy.cop]
barrier_threshold = 0.40
lookahead = 2
claim_threshold = 0.12

# stall_trigger: how close to the survival horizon the thief stops taking
# chances. Surviving to 35 and to 100 score the same, so the last turns are a
# different game.
[strategy.thief]
horizon = 3
stall_trigger = 3

[strength]
level = "full"

# How much of our own evidence we hand the opponent each turn.
#
# We broadcast the whole cumulative pheromone field; uoh-sqak broadcast nothing
# and beat us 15-60. This is the dial that closes that asymmetry, and each mode
# was checked against the agreed terms before it was built — see the module
# docstring in src/najamjad_agent/domain/emission.py for the full working.
#
#   scent = "full"    every scented cell (what we have always sent, 25-29 cells
#                     per turn in the sealed uoh-sqak log, rising as we roam)
#   scent = "window"  only the agreed pheromone_grid_size window around us. A
#                     defensible reading of the same term, not a new one.
#   scent = "none"    an empty map. Legal — the book forbids faking a trail, not
#                     withholding one — but it is the mode to DECLARE in
#                     negotiation rather than spring on an opponent (rule 49
#                     means these repos get read).
#
# Note what "window" does not buy: the centre of a deposit is 0.9 and is the
# unique maximum, so an opponent taking the argmax still reads our exact cell.
# Only "none" hides the current position.
#
# hint = false seals and sends an empty hint. Rule 12 caps hints at 15 words and
# sets no floor, so this breaks no term. Suppression happens before the commit
# is computed, so the sealed record and the wire always agree.
[emission]
scent = "full"
hint = true

# Mirror a peer who tells us nothing. Off by default: going quiet is a choice to
# make deliberately, not one that should happen to us because an opponent's
# tunnel was slow for three turns. When on, we go exactly as quiet as they are
# and only after watching them do it for `SILENCE_GRACE_TURNS` turns first.
reciprocal = false
