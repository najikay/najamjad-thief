# Nightly strategy measurement (T-1424, T-1524).
#
# Separate from `ci` on purpose: a win rate is a *sample*, and gating a merge on
# one teaches people to ignore red builds. The tactical assertions — "do not
# wall on a guess", "never trade room away at the horizon" — are correctness and
# block a merge in `ci`; these numbers are a signal to read.
#
# This file previously invoked `scripts/selfplay_harness.py`, which never
# existed, so it silently reported "skipping by design" on every run and
# measured nothing for weeks. A scheduled job that cannot fail is not a check.
name: nightly-strategy
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies (locked)
        run: uv sync --frozen
      - name: Seeded strategy smoke — floors are alarms, not targets
        run: uv run python scripts/strategy_smoke.py --games 50 --seed 11
      - name: Publish the measured rates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-smoke
          path: results/strategy_smoke.json
          if-no-files-found: warn
