# CI compliance robot (PLAN ADR-010): every guideline gate the grader can
# machine-check runs on every push, so a red main branch is impossible to miss.
name: ci
on: [push, pull_request]

# A superseded run proves nothing and costs a runner. Cancel the in-flight run
# for a branch when a newer commit lands — except on `main`, where every commit
# is a submission candidate and its result is the record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # 20 minutes was set when the suite was small and became unreachable on
    # 2026-08-16, when `test_the_whole_archive.py` added a single 301-second
    # test. Every run since has been killed mid-`tests/regression` and read as
    # "canceled", which looks like flakiness rather than a budget. Measured
    # 2026-08-19: regression + integration alone is 12:00 locally WITHOUT
    # coverage, and CI runs the whole tree with it on a slower runner. Sixty is
    # headroom, not an estimate — the heavy archive and duel benches belong in
    # the nightly workflow beside the other statistical gates, and moving them
    # is the real fix this only buys time for.
    timeout-minutes: 60
    steps:
      # Both target the node24 runtime. The previous pins (checkout@v4,
      # setup-uv@v5) ran on node20, which GitHub deprecated in Sept 2025 and
      # now force-migrates — a warning today, a broken pipeline whenever they
      # stop compensating.
      #
      # setup-uv must be pinned to an EXACT version: from v8 it publishes
      # immutable release tags only, so there is no moving `v8`/`v9` to follow
      # and `@v9` fails to resolve at "Set up job" before any gate runs.
      # checkout still publishes moving majors, so `@v7` picks up its patches.
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          # Cache the resolved wheels against the lockfile. The dependency set
          # is large (FastMCP, the vendor SDKs, matplotlib) and unchanged
          # between most pushes, so this is the difference between a pipeline
          # people wait for and one they ignore.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies (locked)
        run: uv sync --frozen
      - name: Ruff — zero violations (guidelines §7.1)
        run: uv run ruff check .
      - name: File-size gate — 150 hard / 120 warn (guidelines §3.2)
        run: uv run python scripts/check_file_sizes.py
      - name: Repo rules — uv-only, no silent excepts, no secrets
        run: uv run python scripts/check_repo_rules.py
      - name: Structure presence — mandated files exist (guidelines E6 gate)
        run: |
          for f in README.md docs/PRD.md docs/PLAN.md docs/TODO.md docs/CORE_SYNC.md \
                   .env-example uv.lock LICENSE config/rate_limits.json; do
            test -f "$f" || { echo "missing mandated file: $f"; exit 1; }
          done
      - name: Strategy tactical suites — PR-blocking (T-1424, T-1524)
        # Deterministic assertions about single positions: "do not wall on a
        # guess", "step onto an adjacent thief", "never trade room away at the
        # horizon". These are correctness, so they block a merge. The *win
        # rates* are measured nightly instead — a statistical gate teaches
        # people to ignore red builds (docs/CI.md).
        run: uv run pytest tests/unit/test_strategy -q --no-cov
      - name: Tests + coverage >= 85 enforced (guidelines §6.2)
        run: uv run pytest tests/
      - name: Pyright basic (ADR-014, stricter-than-guidelines)
        run: uv run pyright
