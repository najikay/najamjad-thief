[project]
name = "najamjad-thief"
version = "1.00"
description = "NajAmjad thief agent — distributed cops-and-thieves over P2P MCP (course final project)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team NajAmjad" }]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "fastmcp>=3.4.4",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "websockets>=16.1.1",
    "anthropic>=0.120.0",
    "openai>=2.48.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "google-auth-oauthlib>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "pyright>=1.1.360",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/najamjad_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# Local stricter profile beyond the prescribed set (PLAN ADR-008): silent
# exception swallowing was Assignment 6's worst field-failure class.
extend-select = ["S110", "S112"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "goldens: validates against the lecturer's reference sample artifacts",
    "slow: real network or multi-second tests",
]
addopts = "--cov=src/najamjad_agent --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "src/najamjad_agent/ui/static/*"]

[tool.coverage.report]
fail_under = 85

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
