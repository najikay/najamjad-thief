# Copy to `<their-name>.toml`. Two facts decide who we play, and both come
# from THEM — ask for both before a match, not during one.
#
#   url       their MCP endpoint, exactly as they give it (including /mcp)
#   group_id  the id their handshake declares. If this is wrong the filer's
#             rename never fires and the emitted result is keyed by a
#             placeholder instead of their name.
#
# Nothing here can change an agreed game term: those live in the signed
# config/game.json. This file is only "who, and where".
url      = ""
group_id = ""
name     = ""
notes    = ""

# What they told us, in writing, they would play. Optional, and checked rather
# than trusted: `scripts/audit_opponent.py` compares these against the
# `github_commit` their own step-0 record declares on the wire. A team that
# messages one commit and plays another is a rule-53 finding, and without this
# there is nothing to compare their declaration to.
#
# Full 40 characters. A 7-character prefix has already blocked a team in this
# league, and a prefix cannot be compared to a full hash without guessing.
[armed_commits]
cop   = ""
thief = ""
