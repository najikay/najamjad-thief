<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NajAmjad agent</title>
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
<header>
  <h1>NajAmjad <span id="role" class="tag">—</span></h1>
  <div class="badges">
    <span id="provider" class="tag" title="Which model is speaking">provider: —</span>
    <span id="conn" class="tag warn">connecting…</span>
  </div>
</header>

<main>
  <section class="panel board-panel">
    <h2>Board &amp; belief <small>local truth only</small></h2>
    <div id="banner" class="banner">—</div>
    <div id="board" class="board"></div>
    <p class="legend">
      <span class="swatch us"></span> us
      <span class="swatch barrier"></span> barrier
      <span class="swatch belief"></span> belief (brighter = likelier)
      <span class="swatch peak"></span> peak
    </p>
  </section>

  <section class="panel">
    <h2>Dialogue</h2>
    <div id="transcript" class="scroll"></div>
  </section>

  <section class="panel">
    <h2>Negotiation</h2>
    <div id="negotiation" class="scroll"></div>
  </section>

  <section class="panel">
    <h2>Budget &amp; services</h2>
    <div id="budget"></div>
    <div id="gatekeepers" class="mini"></div>
  </section>

  <section class="panel">
    <h2>Match report</h2>
    <div id="report"></div>
  </section>

  <section class="panel wide">
    <h2>Events</h2>
    <div id="events" class="scroll mono"></div>
  </section>
</main>

<script type="module" src="/static/dashboard.js"></script>
</body>
</html>
